[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "commander-deck-generator"
version = "0.1.0"
description = "Sabermetrics for Magic — Commander/EDH deck optimization using LLM-driven reasoning"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi",
    "click",
    "flask",
    "flask-limiter",
    "flask-login",
    "flask-wtf",
    "httpx",
    "mtg-parser",
    "mtgsdk",
    "numpy",
    "pandas",
    "pydantic>=2.0",
    "pyyaml",
    "sentence-transformers",
    "waitress",
]

[project.optional-dependencies]
# Pinned exactly. These tools gate or report on CI, and an unpinned linter
# turns main red on someone else's release day with no change to this repo.
# Bump deliberately, not incidentally.
dev = [
    "black==26.5.1",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "ruff==0.16.4",
    # Stubs for third-party libraries mypy would otherwise report as untyped.
    "types-PyYAML",
    "types-waitress",
    "types-WTForms",
]

[project.scripts]
sabermetrics = "sabermetrics.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
target-version = ["py311"]
line-length = 88

[tool.ruff]
line-length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

# pandas ships no official stubs (pandas-stubs is third-party and lags).
# Scoped to this one module rather than a global ignore_missing_imports, so
# every other untyped import still surfaces instead of being silently swallowed.
[[tool.mypy.overrides]]
module = "pandas.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.package-data]
sabermetrics = ["ui/templates/**/*.html", "ui/static/*", "reasoning/prompts/*.txt"]

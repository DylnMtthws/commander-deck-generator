 <style>text{font-family:Arial,Helvetica,sans-serif} .body{fill:#c2cedd;font-size:19px}.small{fill:#9eafc4;font-size:16px}.heading{fill:#f0f6ff;font-size:25px;font-weight:700}.label{font-size:14px;letter-spacing:2px;font-weight:700;fill:#70dbc8}</style>
</defs>

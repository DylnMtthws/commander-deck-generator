<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1160" viewBox="0 0 1440 1160" role="img" aria-labelledby="title desc">
<title id="title">Commander Deck Generator — end-to-end architecture</title>
<desc id="desc">An authenticated request enters a durable SQLite job. A grounded model profile and prepared public corpus inform legal candidate scoring. Deterministic packages and guarded optimization assemble the deck. Model review and an optional bounded C++ resource probe precede final audits, persistence, and exports. Model inference and the simulator are separate dependencies; uncertainty remains visible. CI builds a verified image for an isolated owner-only service.</desc>

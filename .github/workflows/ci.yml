name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      # Report-only. Every rule runs and the findings are in this log, but the
      # repo carries ~345 of them and failing on that would make the build a
      # thing people route around rather than read. Tighten as the count falls.
      - name: Lint (ruff, report-only)
        continue-on-error: true
        run: ruff check .

      # Report-only, same reasoning: ~45 errors outstanding.
      - name: Types (mypy, report-only)
        continue-on-error: true
        run: mypy src/

      # The gate. This one must pass.
      - name: Tests (pytest)
        env:
          # Verified: the suite passes with this unset, so nothing requires it.
          # It is set anyway as a guard -- a dummy value means a test that ever
          # does reach for the API fails loudly on a bad key instead of
          # depending on whatever happens to be in the runner's environment.
          HF_TOKEN: dummy-key-not-used-by-tests
        run: pytest -q

  container:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build generator image
        run: docker build --build-arg SABER_BUILD_SHA=${{ github.sha }} -t commander-generator-ci .
      - name: Verify installed app and owner access without network
        run: docker run --rm -i --network none --read-only --tmpfs /data:rw,uid=1001,gid=1001 --tmpfs /tmp:rw,mode=1777 commander-generator-ci python - < scripts/smoke_container.py
      - name: Package tested main image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p release
          docker save commander-generator-ci | gzip -1 > release/image.tar.gz
          docker image inspect commander-generator-ci > release/image.json
          cd release
          sha256sum image.tar.gz > SHA256SUMS
      - name: Retain exact release image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: generator-${{ github.sha }}-${{ github.run_attempt }}
          path: release/
          retention-days: 7
          compression-level: 0
